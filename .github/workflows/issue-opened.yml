name: Issue Opened

on:
  issues:
    types: [opened]

# Minimal permissions for GITHUB_TOKEN — all project mutations use GH_PAT.
permissions:
  issues: write   # needed to apply the triage label

jobs:
  triage:
    name: Add to project and label
    runs-on: ubuntu-latest
    # gh CLI requires GH_TOKEN in Actions context even when -H is passed.
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Add issue to the project AND set Status = Inbox in one step.
      #    addProjectV2ItemById is idempotent — safe to re-run.
      #    We capture the item ID directly from the add mutation to avoid
      #    a second GraphQL round-trip in move-issue-status.sh.
      # ------------------------------------------------------------------
      - name: Add to project and set Status to Inbox
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
        run: |
          if [[ ! -f .env.project ]]; then
            echo "ERROR: .env.project not found. Run scripts/setup-project.sh and commit the file." >&2
            exit 1
          fi
          source .env.project

          for var in PROJECT_ID STATUS_FIELD_ID OPT_INBOX; do
            if [[ -z "${!var:-}" ]]; then
              echo "ERROR: ${var} missing from .env.project" >&2
              exit 1
            fi
          done

          echo "Adding issue ${ISSUE_NODE_ID} to project ${PROJECT_ID}..."
          ITEM_ID=$(gh api graphql \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-Github-Next-Global-ID: 1" \
            -f query='
          mutation {
            addProjectV2ItemById(input: {
              projectId: "'"${PROJECT_ID}"'"
              contentId: "'"${ISSUE_NODE_ID}"'"
            }) {
              item { id }
            }
          }' | jq -r '.data.addProjectV2ItemById.item.id')

          if [[ -z "$ITEM_ID" || "$ITEM_ID" == "null" ]]; then
            echo "ERROR: addProjectV2ItemById returned no item ID" >&2
            exit 1
          fi
          echo "Project item ID: ${ITEM_ID}"

          echo "Setting Status to Inbox (${OPT_INBOX})..."
          gh api graphql \
            -H "Authorization: Bearer ${GH_PAT}" \
            -H "X-Github-Next-Global-ID: 1" \
            -f query='
          mutation {
            updateProjectV2ItemFieldValue(input: {
              projectId: "'"${PROJECT_ID}"'"
              itemId:    "'"${ITEM_ID}"'"
              fieldId:   "'"${STATUS_FIELD_ID}"'"
              value:     { singleSelectOptionId: "'"${OPT_INBOX}"'" }
            }) {
              projectV2Item { id }
            }
          }' | jq -e '.data.updateProjectV2ItemFieldValue.projectV2Item.id' > /dev/null

          echo "Status set to Inbox."

      # ------------------------------------------------------------------
      # 3. Apply the triage label so the team knows this needs review.
      #    Uses GH_PAT to stay consistent; falls back gracefully if the
      #    label doesn't exist yet (gh will create it if --force is set,
      #    but we want an explicit error if setup was skipped).
      # ------------------------------------------------------------------
      - name: Apply triage label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh issue edit ${{ github.event.issue.number }} \
            --add-label triage \
            --repo ${{ github.repository }}
